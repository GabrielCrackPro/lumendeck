name: CI

# One workflow, three jobs: `frontend` and `backend` run in parallel on every
# push and pull request; `release` needs both and only fires for pushes to
# main (or a manual dispatch). The needs: edges do what "wait for CI to
# succeed" used to do by hand back when this was two workflow files.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per-ref: pushes to main (checks + release together) queue so two rapid
  # pushes cannot race to publish; the stale-commit guard skips the queued
  # loser in seconds. PR branches cancel their own superseded runs instead.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The changelog generator reads the tag list to find the previous
          # release; a shallow clone would silently regenerate from one commit.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate app versions
        # `--tag-drift` compares the repository version against the newest
        # published release, which needs `gh`. Off by default so the local
        # pre-commit hook stays offline; this is where being wrong is expensive.
        run: pnpm check:versions --tag-drift
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Validate changelog is current
        run: pnpm changelog:check

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Frontend tests
        run: pnpm test

  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  release:
    needs: [frontend, backend]
    # Runs only where a release makes sense: after checks pass for a push to
    # main, or a manual dispatch against main. Pull requests skip in seconds.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: read
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check whether this version needs a release
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_HEAD_SHA: ${{ github.sha }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          node scripts/check-versions.mjs
          if ($LASTEXITCODE -ne 0) {
            throw "App version manifests are not synchronized."
          }
          $mainHead = gh api "repos/$env:GITHUB_REPOSITORY/commits/main" --jq .sha
          if ($LASTEXITCODE -ne 0) {
            throw "Could not determine the current main commit."
          }
          if ($mainHead -ne $env:CI_HEAD_SHA) {
            Write-Host "Checks ran for a stale main commit; the latest main commit will handle the release."
            "should_release=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          if ($env:TRIGGER_EVENT -eq 'workflow_dispatch') {
            $ciResponse = gh run list --workflow ci.yml --commit $env:CI_HEAD_SHA --limit 20 --json headSha,event,conclusion,status | Out-String
            if ($LASTEXITCODE -ne 0) {
              throw "Could not verify CI for the selected commit."
            }
            $ciRuns = ConvertFrom-Json -InputObject $ciResponse
            $hasSuccessfulCi = @($ciRuns | Where-Object {
              $_.headSha -eq $env:CI_HEAD_SHA -and
              $_.event -eq 'push' -and
              $_.status -eq 'completed' -and
              $_.conclusion -eq 'success'
            }).Count -gt 0
            if (-not $hasSuccessfulCi) {
              throw "Manual releases require a successful CI run for the current main commit."
            }
          }
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $appVersion = [version]$config.version
          # A commit that only records a released version is not a release. The
          # commit-back step below pushes one to main after every publish, and
          # without this the very next run would see a fresh commit that is not
          # the tagged one, decide 0.2.29 <= 0.2.29, and publish 0.2.30 — a loop
          # that would ship an empty release every few minutes. The commit is
          # pushed with GITHUB_TOKEN, which does not trigger a run at all; this
          # is the belt to that pair of braces, and it is what makes the
          # convention a rule rather than a hope.
          $headSubject = (git log -1 --format=%s $env:CI_HEAD_SHA)
          if ($headSubject -match '^chore\(release\)') {
            Write-Host "Commit $env:CI_HEAD_SHA only records a release version ($headSubject); skipping."
            "should_release=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $releaseJson = gh release list --limit 100 --json tagName,isDraft,isPrerelease | Out-String
          if ($LASTEXITCODE -ne 0) {
            throw "Could not query published GitHub releases."
          }
          $releases = ConvertFrom-Json -InputObject $releaseJson
          $latest = $releases |
            Where-Object { -not $_.isDraft -and -not $_.isPrerelease } |
            Sort-Object { [version]($_.tagName.TrimStart('v')) } -Descending |
            Select-Object -First 1
          $releaseVersion = $appVersion
          if ($latest) {
            $latestVersion = [version]($latest.tagName.TrimStart('v'))
            $latestCommit = gh api "repos/$env:GITHUB_REPOSITORY/commits/$($latest.tagName)" --jq .sha
            if ($LASTEXITCODE -eq 0 -and $latestCommit -eq $env:CI_HEAD_SHA) {
              Write-Host "Commit $env:CI_HEAD_SHA is already released as $($latest.tagName); skipping duplicate release."
              "should_release=false" >> $env:GITHUB_OUTPUT
              exit 0
            }
            if ($releaseVersion -le $latestVersion) {
              $releaseVersion = [version]::new($latestVersion.Major, $latestVersion.Minor, $latestVersion.Build + 1)
            }
          }
          $releaseVersion = $releaseVersion.ToString(3)
          node scripts/set-release-version.mjs $releaseVersion
          if ($LASTEXITCODE -ne 0) {
            throw "Could not prepare release version $releaseVersion."
          }
          # The tag this release is replacing. The changelog for a version is
          # "everything since the previous tag", and by the time the commit-back
          # step runs, this release's own tag exists and that range is empty.
          # Passing the previous tag explicitly is what keeps the section from
          # regenerating empty.
          if ($latest) {
            "since_tag=$($latest.tagName)" >> $env:GITHUB_OUTPUT
          }
          "version=$releaseVersion" >> $env:GITHUB_OUTPUT
          "should_release=true" >> $env:GITHUB_OUTPUT
          Write-Host "Preparing release v$releaseVersion from $env:CI_HEAD_SHA."

      # Cache the pnpm store via its own dir; setup-node's cache: pnpm fails
      # on a fresh checkout because `pnpm store path` errors before install.
      - name: Get pnpm store directory
        id: pnpm-cache
        if: steps.version.outputs.should_release == 'true'
        shell: bash
        run: |
          STORE_DIR="$(pnpm store path 2>/dev/null | tail -n 1)"
          echo "dir=$STORE_DIR" >> "$GITHUB_OUTPUT"
          echo "store dir: $STORE_DIR"

      - uses: actions/cache@v4
        if: steps.version.outputs.should_release == 'true'
        with:
          path: ${{ steps.pnpm-cache.outputs.dir }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.should_release == 'true'

      - uses: swatinem/rust-cache@v2
        if: steps.version.outputs.should_release == 'true'
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        if: steps.version.outputs.should_release == 'true'
        run: pnpm install --frozen-lockfile

      # Release notes come from the same generator that writes CHANGELOG.md,
      # so the GitHub release and the in-app changelog cannot disagree. It
      # runs after the version bump, so the section is the version shipping.
      - name: Build changelog
        if: steps.version.outputs.should_release == 'true'
        shell: bash
        run: node scripts/generate-changelog.mjs

      - name: Extract release notes
        if: steps.version.outputs.should_release == 'true'
        id: changelog
        shell: bash
        run: |
          node scripts/generate-changelog.mjs --release-notes > release-notes.md
          {
            echo 'notes<<CHANGELOG_EOF'
            cat release-notes.md
            echo CHANGELOG_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Validate updater signing configuration
        if: steps.version.outputs.should_release == 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "Set the TAURI_SIGNING_PRIVATE_KEY GitHub Actions secret before publishing."
          }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            throw "Set the TAURI_SIGNING_PRIVATE_KEY_PASSWORD GitHub Actions secret before publishing."
          }
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if (-not $config.plugins.updater.pubkey) {
            throw "Set plugins.updater.pubkey in src-tauri/tauri.conf.json before publishing."
          }

      - name: Build Tauri app (NSIS)
        if: steps.version.outputs.should_release == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ steps.version.outputs.version }}
          releaseName: "LumenDeck v${{ steps.version.outputs.version }}"
          releaseBody: ${{ steps.changelog.outputs.notes }}
          releaseDraft: false
          prerelease: false
          # bundle.targets is already ["nsis"] in tauri.conf.json; no args needed.
          # The action uploads src-tauri/target/release/bundle/nsis/*.exe to the release.

      # Written after the publish, not before. The repository version should
      # name a release that exists; a bump that lands first and then fails to
      # publish leaves it claiming a version nobody can install.
      #
      # Started from origin/main rather than the checked-out SHA, because the
      # build takes minutes and main may have moved underneath. That makes this
      # a fast-forward push in the normal case, and it is the reason a superseded
      # release cannot collide here.
      #
      # The push uses the default GITHUB_TOKEN, and GitHub does not start a
      # workflow run for events a GITHUB_TOKEN raises. Without that, this commit
      # would trigger the release job and republish on a loop; the `chore(release)`
      # guard in the version step is the second line of defence.
      - name: Record the released version in the repository
        if: steps.version.outputs.should_release == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SINCE_TAG: ${{ steps.version.outputs.since_tag }}
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          git checkout --quiet -B record-release origin/main
          node scripts/set-release-version.mjs "$VERSION"
          if [ -n "${SINCE_TAG:-}" ]; then
            node scripts/generate-changelog.mjs --since "$SINCE_TAG"
          else
            node scripts/generate-changelog.mjs
          fi
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Version $VERSION is already recorded; nothing to commit."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --quiet -m "chore(release): record $VERSION"
          git push --quiet origin HEAD:main
          echo "Recorded $VERSION on main as $(git rev-parse --short HEAD)."

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The changelog generator reads the tag list to find the previous
          # release; a shallow clone would silently regenerate from one commit.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate app versions
        run: pnpm check:versions

      - name: Validate changelog is current
        run: pnpm changelog:check

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Frontend tests
        run: pnpm test

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
